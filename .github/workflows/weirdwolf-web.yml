name: WeirdWolf web checks

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/weirdwolf-web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/weirdwolf-web.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax and tests
        run: npm run check
