name = "weirdwolf"
main = "worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Create a D1 database in the Cloudflare dashboard, then replace the placeholder below.
# The database ID is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "weirdwolf-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
